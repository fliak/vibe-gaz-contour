server {
    server_name medvedzol.soil.by;

    include /var/www/medvedzol/deploy/app-locations.conf;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medvedzol;
        default_type text/plain;
        try_files $uri =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/medvedzol.soil.by/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/medvedzol.soil.by/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80;
    listen [::]:80;
    server_name medvedzol.soil.by;
    root /var/www/medvedzol;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://medvedzol.soil.by$request_uri;
    }


}
