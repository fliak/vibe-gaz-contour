# Standalone example. If Certbot already manages the live configuration,
# merge app-locations.conf into its HTTPS server instead of replacing SSL settings.
server {
    listen 80;
    listen [::]:80;
    server_name medvedzol.soil.by;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/medvedzol;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medvedzol.soil.by;
    ssl_certificate /etc/letsencrypt/live/medvedzol.soil.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medvedzol.soil.by/privkey.pem;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    include /var/www/medvedzol/deploy/app-locations.conf;
}
