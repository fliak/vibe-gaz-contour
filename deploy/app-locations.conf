# Include inside the HTTPS server block. Keep existing Certbot settings.
root /var/www/medvedzol/dist;
index index.html;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "camera=(), geolocation=()" always;

location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    try_files $uri =404;
    expires -1;
}
location = /service-worker.js {
    try_files $uri =404;
    expires -1;
}
location /config/ {
    try_files $uri =404;
    expires -1;
}
location /assets/ {
    try_files $uri =404;
    expires 1y;
}
location /documents/ {
    try_files $uri =404;
}
location ~ /\. {
    deny all;
}
location / {
    try_files $uri $uri/ /index.html;
    expires -1;
}

access_log /var/log/nginx/medvedzol.access.log;
error_log /var/log/nginx/medvedzol.error.log;
